{{- /* Wraps tables so wide rubrics scroll inside the column instead of
       pushing the page sideways. */ -}}
<div class="table-scroll">
  <table
    {{- range $k, $v := .Attributes }}
      {{- if $v }} {{ $k }}="{{ $v }}"{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
