{{- /* Root-relative links written in content (`/projects/project-1/`) must be
       prefixed with the baseURL path, or they 404 on a site published under a
       subpath. See _partials/rel.html for why relURL does not do this. */ -}}
<a href="{{ partial "rel.html" .Destination }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- if or (hasPrefix .Destination "http://") (hasPrefix .Destination "https://") }} rel="noopener"{{ end -}}
>{{ .Text }}</a>
