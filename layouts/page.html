{{ define "main" }}
{{- $course := site.Params.course | default dict -}}
<div class="wrap wrap--narrow">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.subtitle }}
    <div class="subtitle">{{ . }}</div>
  {{ else }}
    <div class="subtitle">{{ $course.code }}{{ with $course.term }} — {{ . }}{{ end }}</div>
  {{ end }}
  <div class="syllabus prose">{{ .Content }}</div>
</div>
{{ end }}
